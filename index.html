<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trionfo">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/trionfo-192.png">
  <link rel="apple-touch-icon" href="./icons/trionfo-192.png">
  <title>Trionfo Ferrarese</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Trionfo Ferrarese</div>
      <div class="top-actions">
        <label class="tutor-toggle">
          <input id="tutorEnabled" type="checkbox" checked>
          <span>Tutor</span>
        </label>
        <label class="debug-toggle">
          <input id="debugEnabled" type="checkbox">
          <span>Debug</span>
        </label>
        <label class="profanity-toggle" title="Disattiva le bestemmie di Ginetto">
          <input id="profanityEnabled" type="checkbox" checked>
          <span>Bestemmie</span>
        </label>
        <label class="speed-control">
          <span>Ritmo</span>
          <select id="aiSpeed">
            <option value="950">Svelto</option>
            <option value="1450" selected>Da tavolo</option>
            <option value="2100">Suspense</option>
          </select>
        </label>
        <button id="newMatchBtn" class="new-btn">Nuova</button>
        <button id="installAppBtn" class="pwa-button hidden" type="button" title="Installa Trionfo Ferrarese su questo dispositivo">Installa</button>
        <button id="offlineSaveBtn" class="pwa-button" type="button" title="Scarica V14, runtime ONNX e carte per giocare offline">Offline</button>
      </div>
    </header>

    <div id="modelStatus" class="model-status">Caricamento V14…</div>
    <div id="pwaStatus" class="pwa-status" role="status" aria-live="polite"></div>
    <main class="game-layout">
      <section class="table-panel">
        <div class="scorebar">
          <div class="team-score">
            <span>Tu + Ginetto</span>
            <strong id="scoreTeam0">0</strong>
          </div>
          <div class="match-meta">
            <span id="handNumber">Mano 1</span>
            <strong id="trumpBadge" class="trump-badge"><span>Briscola: —</span></strong>
            <span id="turnLabel">—</span>
          </div>
          <div class="team-score team-ai">
            <strong id="scoreTeam1">0</strong>
            <span>Tonino + Mario</span>
          </div>
        </div>

        <div class="felt-table">
          <button id="callOutBtn" type="button" class="call-out-btn hidden" title="Chiama fuori a 41 punti. Una chiamata sbagliata fa perdere!">Mi chiamo fuori!</button>
          <div class="player-zone north-zone" data-player="2">
            <div class="player-name">Ginetto</div>
            <div id="partnerSpeech" class="partner-speech hidden"></div>
            <div id="northBacks" class="back-hand horizontal"></div>
            <div id="northCount" class="card-count">10</div>
          </div>

          <div class="player-zone west-zone" data-player="3">
            <div class="player-name">Mario</div>
            <div id="westBacks" class="back-hand vertical"></div>
            <div id="westCount" class="card-count">10</div>
          </div>

          <div class="center-area">
            <div class="trick-grid">
              <div id="slot2" class="trick-slot slot-north"><span class="slot-label">Ginetto</span></div>
              <div id="slot3" class="trick-slot slot-west"><span class="slot-label">Mario</span></div>
              <div class="center-token">
                <strong id="trickNumber">Mano 1/10</strong>
                <span id="chooserLabel">Mette: —</span>
              </div>
              <div id="slot1" class="trick-slot slot-east"><span class="slot-label">Tonino</span></div>
              <div id="slot0" class="trick-slot slot-south"><span class="slot-label">Tu</span></div>
            </div>
          </div>

          <div class="player-zone east-zone" data-player="1">
            <div class="player-name">Tonino</div>
            <div id="eastBacks" class="back-hand vertical"></div>
            <div id="eastCount" class="card-count">10</div>
          </div>

          <div class="player-zone south-zone" data-player="0">
            <div class="human-line">
              <div class="player-name">Tu</div>
              <div id="humanHint" class="human-hint"></div>
            </div>
            <div id="inlineTutor" class="inline-tutor hidden"></div>
            <div id="humanHand" class="human-hand"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="game.js"></script>
  <script src="ai.js"></script>
  <script src="vendor/ort.wasm.min.js"></script>
  <script src="onnx_tutor.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js" defer></script>
</body>
</html>
